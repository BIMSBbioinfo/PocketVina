name: Notebook

# Runs notebooks/quickstart_colab.ipynb from start to end on Colab's Python (tests/test_notebook.py): headless with
# nbclient, the fake engine (tests/fake_engine.py) instead of the GPU and the fixture P2Rank pockets of tests/data
# instead of P2Rank. ci.yml runs the same test on Python 3.9 to 3.12. Only on main (when the notebook or what it runs
# changes), v* tags and manual runs.
on:
  push:
    branches: [main]
    tags: ["v*"]  # path filters are not evaluated for tags
    paths:
      - "notebooks/**"
      - "pocketvina/**"
      - "example/**"
      - "tests/fake_engine.py"
      - "tests/test_notebook.py"
      - "tests/data/**"
      - "pyproject.toml"
      - "setup.py"
      - ".github/workflows/notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute:
    name: Quickstart notebook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # Colab's (github.com/googlecolab/backend-info)
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pocketvina with the notebook's extras
        run: python -m pip install ".[bust,viz,dev]" "setuptools>=77"
      - name: Run the notebook
        run: python -m pytest tests/test_notebook.py -m "not gpu" -v
