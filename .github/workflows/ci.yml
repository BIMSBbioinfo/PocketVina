name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pinned: new ruff releases add stable B/E/W rules; the per-file-ignores in pyproject.toml match this version
      - name: Install ruff
        run: python -m pip install "ruff==0.17.3"
      # new code only; pocketvina/main.py has relaxed rules in pyproject.toml
      - name: Ruff
        run: ruff check pocketvina/io pocketvina/*.py tests

  test:
    # setup-python has no Python 3.9 for Ubuntu 26.04 (ubuntu-latest from November 2026): 3.9 stays on Ubuntu 24.04
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # the dependencies as pyproject.toml declares them (e.g. pandas<3) with the extras the tests use; `pip install .`
      # only copies files (no engine build, no download). The tests still import the checkout (pythonpath in
      # [tool.pytest.ini_options]). setuptools: the build backend that tests/test_packaging.py calls in this Python
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[bust,viz,meeko,dev]" "setuptools>=77"
      - name: Versions
        run: python -c "import sys, rdkit, pandas, pyarrow; print(sys.version, rdkit.__version__, pandas.__version__, pyarrow.__version__)"
      - name: Pytest (no GPU; the engine is tests/fake_engine.py)
        run: python -m pytest tests -m "not gpu"
